<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedHealth AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#10B981', // Emerald 500
                light: '#34D399',   // Emerald 400
                dark: '#059669',    // Emerald 600
              },
              slate: {
                900: '#F0FDF4', // Main background (Light Mint)
                800: '#FFFFFF', // Surface (White)
                700: '#F1F5F9', // Inputs/Secondary Button (Very Light Gray)
                600: '#CBD5E1', // Borders (Light Gray)
                500: '#94A3B8', // Placeholders (Slate 400)
                400: '#64748B', // Secondary Text (Slate 500)
                100: '#1E293B', // Primary Text (Slate 800 - Dark)
              },
              accent: {
                red: '#EF4444',
                sky: '#0EA5E9',
                blue: '#3B82F6',
                purple: '#8B5CF6',
              }
            },
            keyframes: {
              fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
              slideInUp: { '0%': { opacity: 0, transform: 'translateY(20px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
              scaleIn: { '0%': { opacity: 0, transform: 'scale(0.95)' }, '100%': { opacity: 1, transform: 'scale(1)' } },
              pulse: { '0%, 100%': { opacity: 1 }, '50%': { opacity: .7 } },
            },
            animation: {
              fadeIn: 'fadeIn 0.5s ease-out forwards',
              slideInUp: 'slideInUp 0.5s ease-out forwards',
              scaleIn: 'scaleIn 0.3s ease-out forwards',
              pulse: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.45.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-primary selection:text-white">
    <div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-emerald-100 via-slate-900 to-white -z-10 opacity-60"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
